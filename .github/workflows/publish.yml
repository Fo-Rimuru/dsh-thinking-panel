# 推 tag（v*）时自动发布到 npm，并建好 GitHub Release。
#
# 为什么需要它：npm 的交互式 2FA 没法在自动化里完成（Windows Hello 的验证界面跑在
# Windows 安全桌面上，脚本既截不到也点不到）。改用存在仓库 Secrets 里的 NPM_TOKEN
# （Granular Access Token，勾了 Bypass 2FA）后，CI 就能自己发布，人不必在场。
#
# 手动触发（Actions 页面 → Run workflow）时可以勾 dry_run：只走完打包与校验、
# 不真正上传 —— 用来在信任整条链路之前先验证一遍。

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只演练（不真正发布到 npm）'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建 Release
      id-token: write   # npm provenance（来源证明）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # ⚠️ **故意不设 registry-url**：设了它，setup-node 会生成一个 `.npmrc`，内容形如
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # 而走 Trusted Publishing（OIDC）时这个变量根本不存在 —— npm 会拿空 token 去认证
          # 然后失败（实测报了两次 `npm error code EOTP` 之后才发现这一层）。
          # OIDC 的短期凭据由 npm 自己通过 id-token 换取，不需要任何 .npmrc。

      # 版本一致性：tag 必须与 package.json 完全一致。
      # npm 上的版本不能删除、只能废弃，发错代价很大，所以宁可在这里就失败。
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag（$TAG）与 package.json（$PKG）不一致，拒绝发布"
            exit 1
          fi

      # 这个插件没有运行时依赖，所以不需要 npm ci
      - name: 自检
        run: node tools/verify.mjs

      - name: 自更新单测
        run: node tools/test-self-update.mjs

      # 双保险：万一别的步骤又留下了 .npmrc，这里清掉，确保 npm 走 OIDC 而不是找 token
      - name: 清掉可能存在的 .npmrc（OIDC 不需要 token 文件）
        run: rm -f .npmrc "$HOME/.npmrc"

      # ⚠️ **Trusted Publishing 需要 npm >= 11.5.1**，而 setup-node 装的 Node 22 自带 npm 10.x。
      # 旧版 npm 不认识 OIDC 换来的凭据，于是把自己当成「没登录」，实测报：
      #   npm error code ENEEDAUTH
      #   npm error need auth This command requires you to be logged in to https://registry.npmjs.org/
      # 所以发布前必须先升级 npm。这一条是排查了四次失败才定位到的。
      - name: 升级 npm（Trusted Publishing 需要 >= 11.5.1）
        run: |
          npm install -g npm@latest
          echo "npm 版本: $(npm --version)"

      - name: 发布到 npm
        # ⚠️ 这里**故意不传 NODE_AUTH_TOKEN** —— 走 npm 的 Trusted Publishing（OIDC）：
        # GitHub 用工作流的身份令牌向 npm 换取**短期**凭据，所以不需要任何长期 token。
        #
        # 为什么放弃 token 方案：实测带「Bypass 2FA」的 Granular token 发布时仍然报
        #   npm error code EOTP
        #   npm error This operation requires a one-time password from your authenticator.
        # 而 npm 已公告要限制「能绕过 2FA 的 token」（直接发布自 2027 年 1 月起），
        # 其包页面上也直接把 Trusted Publishing 标为自动化场景的推荐做法。
        #
        # 前提：在 npm 包设置页配好 Trusted Publisher（owner/repo + 本文件名 publish.yml）。
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "== 演练模式：只打包，不上传 =="
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi

      - name: 建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
